[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exec-advisor"
version = "0.1.0"
description = "A multi-agent AI executive advisor: grounded findings, adversarial review, computed change detection."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "anthropic>=0.40"]

[project.scripts]
advisor = "advisor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
